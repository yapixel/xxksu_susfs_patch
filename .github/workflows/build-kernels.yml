name: "Build Real Kernels: 4-Profile Production CI"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to Build (all, sultan, gki_r38)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "sultan"
          - "gki_r38"
      hook_mode:
        description: "Hook Mode (all, manual, lsm_bl)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "manual"
          - "lsm_bl"

permissions:
  contents: read
  actions: write

jobs:
  build_sultan:
    name: "Sultan 6.1 (${{ matrix.hook_mode }})"
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'sultan' || github.event.inputs.target == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook_mode: [manual, lsm_bl]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev bc bison flex libssl-dev make zip tar libelf-dev liblz4-tool

      - name: Install Arm GNU Toolchain 14.2.rel1
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/toolchain"
          cd "${{ github.workspace }}/toolchain"
          echo "📥 Downloading Arm GNU Toolchain 14.2.rel1..."
          aria2c -s 16 -x 16 -k 1M "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/14.2.rel1/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" -o arm-toolchain.tar.xz
          tar -xf arm-toolchain.tar.xz
          rm -f arm-toolchain.tar.xz
          TOOLCHAIN_DIR="${{ github.workspace }}/toolchain/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu"
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "✅ Toolchain installed: $($TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-gcc --version | head -n1)"

      - name: Clone Sultan Kernel, SuSFS, xxKSU and AnyKernel3
        run: |
          set -euo pipefail
          echo "📥 Cloning Sultan tensynos kernel (16.0.0-sultan / af5c65b9)..."
          git clone --depth=1 --single-branch -b "16.0.0-sultan" "https://github.com/kerneltoast/android_kernel_google_tensynos.git" sultan
          cd sultan
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "af5c65b9547a9f33c5f566430d0434aecab5a8b5" ]; then
            echo "❌ Sultan commit mismatch: expected af5c65b9547a9f33c5f566430d0434aecab5a8b5, got $ACTUAL_COMMIT"
            exit 1
          fi
          cd ..

          echo "📥 Fetching upstream SuSFS (sultan-shiba-susfs-minimal / 7fd1da8e)..."
          git init susfs_src
          cd susfs_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://gitlab.com/simonpunk/susfs4ksu.git"
          git fetch --depth=1 origin "7fd1da8e0cc8d1b572c97c5fe4a27d0ec6e3e2f1"
          git checkout FETCH_HEAD
          cd ..

          echo "📥 Fetching authoritative xxKSU (0b138d6a)..."
          git init xxksu_src
          cd xxksu_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://github.com/backslashxx/KernelSU.git"
          git fetch --depth=1 origin "0b138d6a9cfe4dc163aa05c21b1e6a14ff868230"
          git checkout FETCH_HEAD
          cd ..

          echo "📥 Cloning AnyKernel3 (sultan-gs201)..."
          git clone --depth=1 --single-branch -b "sultan-gs201" "https://github.com/yapixel/AnyKernel3.git" anykernel3

      - name: Integrate SuSFS, xxKSU and Patches (Sultan 6.1)
        run: |
          set -euo pipefail
          cd sultan

          echo "📋 Copying SuSFS core source files..."
          mkdir -p fs/ include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "🧪 Applying verified Sultan Patch 51..."
          patch -p1 < "${{ github.workspace }}/patches/sultan-android14-6.1/51_deinlined_susfs_hooks_sultan-android14-6.1.patch"

          echo "🧪 Wiring xxKSU source..."
          cp -r "${{ github.workspace }}/xxksu_src" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "🧪 Applying verified shared Patch 11 to xxKSU..."
          cd KernelSU
          patch -p1 < "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch"
          cd ..

          echo "🧪 Applying Sultan base patches..."
          patch -p1 < "${{ github.workspace }}/.github/fixtures/sultan/60_scripts_mkcompile_h.patch"
          patch -p1 < "${{ github.workspace }}/.github/fixtures/sultan/61_scripts_setlocalversion.patch"
          patch -p1 < "${{ github.workspace }}/.github/fixtures/sultan/62_init_Makefile.patch"
          patch -p1 < "${{ github.workspace }}/.github/fixtures/sultan/0001-modify-noinline.patch"

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            echo "🧪 Applying manual security hooks (manual profile)..."
            patch -p1 -l < "${{ github.workspace }}/.github/fixtures/manual-security-hooks-v2.0.patch"
            patch -p1 -l < "${{ github.workspace }}/.github/fixtures/scope-min-manual-hooks-v2.3.patch"
          else
            echo "ℹ️ LSM/BL profile: skipping manual security hooks."
          fi

          if [ -n "$(find . -name "*.rej")" ]; then
            echo "❌ Patch rejects found!"
            find . -name "*.rej"
            exit 1
          fi
          echo "✅ All Sultan patches applied cleanly with 0 rejects!"

      - name: Configure Kernel (Sultan 6.1)
        run: |
          set -euo pipefail
          cd sultan
          mkdir -p out

          echo "⚙️ Generating base gs201_defconfig..."
          make O=out ARCH=arm64 CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" CC="${{ env.TOOLCHAIN_PATH }}gcc" gs201_defconfig

          echo "⚙️ Injecting SuSFS and profile Kconfigs..."
          cat >> out/.config <<-'EOF'
          # SuSFS Base Configurations
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KSU_SUSFS_TRY_UMOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set
          CONFIG_KSU_FEATURE_SULOG=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_HOSTSREDIRECT=y
          EOF

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            cat >> out/.config <<-'EOF'
          # xxKSU Manual Hook Configurations
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=n
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=n
          CONFIG_KSU_KPROBES_KSUD=n
          EOF
          elif [ "${{ matrix.hook_mode }}" = "lsm_bl" ]; then
            cat >> out/.config <<-'EOF'
          # xxKSU LSM + Branch Link Hook Configurations
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_KPROBES_KSUD=n
          EOF
          fi

          echo "⚙️ Finalizing defconfig with olddefconfig..."
          make O=out ARCH=arm64 CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" CC="${{ env.TOOLCHAIN_PATH }}gcc" olddefconfig

      - name: Build Sultan Kernel Image
        run: |
          set -euo pipefail
          cd sultan
          echo "🔨 Compiling Sultan 6.1 (${{ matrix.hook_mode }})..."
          make O=out ARCH=arm64 CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" CC="${{ env.TOOLCHAIN_PATH }}gcc" -j"$(nproc --all)"

      - name: Verify Sultan Build Artifacts & Link Evidence
        run: |
          set -euo pipefail
          echo "🔍 Verifying Sultan 6.1 (${{ matrix.hook_mode }}) build artifacts & link evidence..."
          IMG="sultan/out/arch/arm64/boot/Image.lz4"
          VMLINUX="sultan/out/vmlinux"
          SYSMAP="sultan/out/System.map"
          DOTCONFIG="sultan/out/.config"
          SUSFS_OBJ="sultan/out/fs/susfs.o"
          KSU_OBJ="sultan/out/drivers/kernelsu/ksu.o"
          AR="${{ env.TOOLCHAIN_PATH }}ar"
          NM="${{ env.TOOLCHAIN_PATH }}nm"
          READELF="${{ env.TOOLCHAIN_PATH }}readelf"

          echo "=== MANDATORY GATE 1: Valid Kernel Image ($IMG) ==="
          if [ ! -f "$IMG" ]; then
            echo "❌ ERROR: $IMG not found!"
            exit 1
          fi
          IMG_SIZE=$(stat -c%s "$IMG")
          echo "Image.lz4 size: $IMG_SIZE bytes"
          if [ "$IMG_SIZE" -lt 10000000 ]; then
            echo "❌ ERROR: Image.lz4 size ($IMG_SIZE bytes) is suspiciously small (<10MB)!"
            exit 1
          fi
          lz4 -t "$IMG"
          echo "  ✅ Valid LZ4 compressed image verified"

          echo "=== MANDATORY GATE 2: ELF64 / AArch64 vmlinux ($VMLINUX) ==="
          if [ ! -f "$VMLINUX" ]; then
            echo "❌ ERROR: $VMLINUX not found!"
            exit 1
          fi
          VMLINUX_SIZE=$(stat -c%s "$VMLINUX")
          echo "vmlinux size: $VMLINUX_SIZE bytes"
          if [ "$VMLINUX_SIZE" -lt 20000000 ]; then
            echo "❌ ERROR: vmlinux size ($VMLINUX_SIZE bytes) is suspiciously small (<20MB)!"
            exit 1
          fi
          "$READELF" -h "$VMLINUX" | grep -E "Class:.*ELF64"
          "$READELF" -h "$VMLINUX" | grep -E "Machine:.*AArch64"
          VMLINUX_TYPE=$("$READELF" -h "$VMLINUX" | grep -E "Type:" | sed -e 's/^[[:space:]]*Type:[[:space:]]*//')
          echo "  ✅ vmlinux ELF64 / AArch64 verified (ELF Type: $VMLINUX_TYPE)"

          echo "=== MANDATORY GATE 3: SuSFS Object & Archive Compilation ==="
          if [ ! -f "$SUSFS_OBJ" ]; then
            echo "❌ ERROR: SuSFS object ($SUSFS_OBJ) was not compiled!"
            exit 1
          fi
          "$READELF" -h "$SUSFS_OBJ" | grep -q "ELF64"
          "$READELF" -h "$SUSFS_OBJ" | grep -q "AArch64"
          echo "  ✅ Compiled SuSFS object verified: $SUSFS_OBJ (ELF64 AArch64)"

          FS_ARCHIVE=""
          for candidate in "sultan/out/vmlinux.a" "sultan/out/fs/built-in.a" $(find sultan/out -name "*.a" 2>/dev/null); do
            if [ -f "$candidate" ] && "$AR" t "$candidate" 2>/dev/null | grep -q "susfs.o"; then
              FS_ARCHIVE="$candidate"
              break
            fi
          done
          if [ -n "$FS_ARCHIVE" ]; then
            echo "  ✅ SuSFS object confirmed archived in $FS_ARCHIVE"
          else
            echo "❌ ERROR: susfs.o is not archived in any kernel archive!"
            exit 1
          fi

          echo "=== MANDATORY GATE 4: xxKSU Object & Archive Compilation ==="
          if [ ! -f "$KSU_OBJ" ]; then
            echo "❌ ERROR: xxKSU object ($KSU_OBJ) was not compiled!"
            exit 1
          fi
          "$READELF" -h "$KSU_OBJ" | grep -q "ELF64"
          "$READELF" -h "$KSU_OBJ" | grep -q "AArch64"
          echo "  ✅ Compiled xxKSU object verified: $KSU_OBJ (ELF64 AArch64)"

          KSU_ARCHIVE=""
          for candidate in "sultan/out/vmlinux.a" "sultan/out/drivers/kernelsu/built-in.a" "sultan/out/drivers/built-in.a" $(find sultan/out -name "*.a" 2>/dev/null); do
            if [ -f "$candidate" ] && "$AR" t "$candidate" 2>/dev/null | grep -q "ksu.o"; then
              KSU_ARCHIVE="$candidate"
              break
            fi
          done
          if [ -n "$KSU_ARCHIVE" ]; then
            echo "  ✅ xxKSU object confirmed archived in $KSU_ARCHIVE"
          else
            echo "❌ ERROR: ksu.o is not archived in any kernel archive!"
            exit 1
          fi

          echo "=== MANDATORY GATE 5: Exact Final .config & Profile Contract ==="
          grep -q "CONFIG_KSU_SUSFS=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_PATH=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_PATH missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_KSTAT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_KSTAT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SPOOF_UNAME missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_ENABLE_LOG=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_ENABLE_LOG missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_OPEN_REDIRECT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_MAP=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_MAP missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU missing in .config!"; exit 1; }

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            if grep -q "CONFIG_KSU_LSM_SECURITY_HOOKS=y" "$DOTCONFIG"; then
              echo "❌ CONFIG_KSU_LSM_SECURITY_HOOKS unexpectedly enabled in manual mode!"
              exit 1
            fi
            if grep -q "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" "$DOTCONFIG"; then
              echo "❌ CONFIG_KSU_HACK_ARM64_BRANCH_LINK unexpectedly enabled in manual mode!"
              exit 1
            fi
            echo "  ✅ Verified manual profile .config contract (LSM & BL hooks unset)"
          elif [ "${{ matrix.hook_mode }}" = "lsm_bl" ]; then
            grep -q "CONFIG_KSU_LSM_SECURITY_HOOKS=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_LSM_SECURITY_HOOKS missing in .config!"; exit 1; }
            grep -q "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_HACK_ARM64_BRANCH_LINK missing in .config!"; exit 1; }
            echo "  ✅ Verified lsm_bl profile .config contract (LSM & BL hooks enabled)"
          fi

          echo "=== SUPPORTING EVIDENCE: System.map & Link Symbols ==="
          if [ -f "$SYSMAP" ]; then
            SYSMAP_TOTAL=$(wc -l < "$SYSMAP")
            echo "  System.map total symbols: $SYSMAP_TOTAL"
            SUSFS_COUNT=$(grep -c -E "[[:space:]]susfs_" "$SYSMAP" || true)
            echo "  SuSFS symbols in System.map: $SUSFS_COUNT"
            KSU_COUNT=$(grep -c -E "[[:space:]](kernelsu|ksu)_" "$SYSMAP" || true)
            echo "  xxKSU symbols in System.map: $KSU_COUNT"

            if grep -w "kernelsu_init" "$SYSMAP" >/dev/null 2>&1; then
              echo "  ℹ️ Supporting: found device_initcall symbol in System.map: kernelsu_init"
            elif "$NM" "$VMLINUX" 2>/dev/null | grep -w "kernelsu_init" >/dev/null 2>&1; then
              echo "  ℹ️ Supporting: found device_initcall symbol in vmlinux: kernelsu_init"
            else
              echo "  ℹ️ Supporting: kernelsu_init internalized or inlined by compiler/LTO"
            fi

            if [ "${{ matrix.hook_mode }}" = "manual" ]; then
              MANUAL_FOUND=0
              for sym in ksu_inode_rename ksu_handle_execveat ksu_task_fix_setuid; do
                if grep -w "$sym" "$SYSMAP" >/dev/null 2>&1; then
                  echo "  ℹ️ Supporting: found manual hook symbol: $sym"
                  MANUAL_FOUND=1
                fi
              done
              if [ "$MANUAL_FOUND" -eq 1 ]; then
                echo "  ✅ Manual hook symbols observed in System.map"
              else
                echo "  ℹ️ Supporting: manual hook symbols inlined/optimized by compiler"
              fi
              if grep -w "ksu_do_execveat_common" "$SYSMAP" >/dev/null 2>&1; then
                echo "  ⚠️ Supporting: ksu_do_execveat_common present in System.map"
              else
                echo "  ✅ Confirmed BL hook symbol absent in manual mode"
              fi
            elif [ "${{ matrix.hook_mode }}" = "lsm_bl" ]; then
              BL_FOUND=0
              for sym in ksu_do_execveat_common ksu_do_execveat_common_fn; do
                if grep -w "$sym" "$SYSMAP" >/dev/null 2>&1; then
                  echo "  ℹ️ Supporting: found BL hook symbol: $sym"
                  BL_FOUND=1
                fi
              done
              if [ "$BL_FOUND" -eq 1 ]; then
                echo "  ✅ BL hook symbols observed in System.map"
              else
                echo "  ℹ️ Supporting: BL hook symbols inlined/optimized by compiler"
              fi
            fi
          else
            echo "  ℹ️ System.map not generated; object and image verification pass."
          fi

          echo "✅ Strict post-build validation PASSED for Sultan 6.1 (${{ matrix.hook_mode }})!"

      - name: Package AnyKernel3 Flashable ZIP (Sultan 6.1)
        run: |
          set -euo pipefail
          cp "sultan/out/arch/arm64/boot/Image.lz4" anykernel3/Image.lz4
          ZIP_NAME="xxKSU_Sultan_6.1_${{ matrix.hook_mode }}_SUSFS-1.5.5.zip"
          ( cd anykernel3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          mkdir -p artifacts
          mv "$ZIP_NAME" artifacts/
          cp sultan/out/.config "artifacts/config_sultan_${{ matrix.hook_mode }}"

      - name: Upload Sultan Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel_sultan-android14-6.1-${{ matrix.hook_mode }}
          path: artifacts/

  build_gki_r38:
    name: "GKI 6.12 r38 (${{ matrix.hook_mode }})"
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'gki_r38' || github.event.inputs.target == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook_mode: [manual, lsm_bl]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev m4 bc bison flex libssl-dev make zip tar libelf-dev kmod

      - name: Install Clang r536225, Rust 1.82.0 and Build Tools
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/toolchains"
          cd "${{ github.workspace }}/toolchains"
          echo "📥 Concurrently downloading Clang r536225, Rust 1.82.0, build tools..."
          aria2c -s 16 -x 16 -k 1M "https://github.com/yapixel/gki-build-assets/releases/download/r536225/clang-r536225.tar.gz" -o clang.tar.gz &
          aria2c -s 16 -x 16 -k 1M "https://github.com/yapixel/gki-build-assets/releases/download/r536225/rust-1.82.0.tar.gz" -o rust.tar.gz &
          aria2c -s 16 -x 16 -k 1M "https://github.com/yapixel/gki-build-assets/releases/download/r536225/clang-tools-r536225.tar.gz" -o clang-tools.tar.gz &
          aria2c -s 16 -x 16 -k 1M "https://github.com/yapixel/gki-build-assets/releases/download/r536225/build-tools.tar.gz" -o build-tools.tar.gz &
          wait

          mkdir -p clang && tar -xzf clang.tar.gz -C clang && rm -f clang.tar.gz &
          mkdir -p rust && tar -xzf rust.tar.gz -C rust && rm -f rust.tar.gz &
          mkdir -p clang-tools && tar -xzf clang-tools.tar.gz -C clang-tools && rm -f clang-tools.tar.gz &
          mkdir -p build-tools && tar -xzf build-tools.tar.gz -C build-tools && rm -f build-tools.tar.gz &
          wait

          echo "${{ github.workspace }}/toolchains/clang/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/toolchains/build-tools/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/toolchains/clang-tools" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/toolchains/rust/bin" >> "$GITHUB_PATH"
          echo "✅ Toolchains extracted and added to PATH"

      - name: Download GKI r38 Source, SuSFS, xxKSU and AnyKernel3
        run: |
          set -euo pipefail
          mkdir -p kernel_tree
          echo "📥 Downloading android16-6.12-2025-09_r38 kernel source archive..."
          curl -LSs "https://github.com/yapixel/gki-build-assets/releases/download/android16-6.12-2025-09_r38/common-android16-6.12-2025-09_r38.tar.gz" | tar -xz -C kernel_tree
          sed -i 's/ -dirty//g' kernel_tree/scripts/setlocalversion 2>/dev/null || true

          echo "📥 Fetching upstream SuSFS (gki-android16-6.12 / c8f64e41)..."
          git init susfs_src
          cd susfs_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://gitlab.com/simonpunk/susfs4ksu.git"
          git fetch --depth=1 origin "c8f64e41e3dea2cd44754d7472d3cd0bc0b40784"
          git checkout FETCH_HEAD
          cd ..

          echo "📥 Fetching authoritative xxKSU (0b138d6a)..."
          git init xxksu_src
          cd xxksu_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://github.com/backslashxx/KernelSU.git"
          git fetch --depth=1 origin "0b138d6a9cfe4dc163aa05c21b1e6a14ff868230"
          git checkout FETCH_HEAD
          cd ..

          echo "📥 Cloning AnyKernel3 (gki-2.0)..."
          git clone --depth=1 --single-branch -b "gki-2.0" "https://github.com/yapixel/AnyKernel3.git" anykernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel3/anykernel.sh

      - name: Integrate SuSFS, xxKSU and Patches (GKI 6.12 r38)
        run: |
          set -euo pipefail
          cd kernel_tree

          echo "📋 Copying SuSFS core source files..."
          mkdir -p fs/ include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "🧪 Applying verified GKI r38 Patch 51..."
          patch -p1 < "${{ github.workspace }}/patches/gki-android16-6.12/51_deinlined_susfs_hooks_android16-6.12-2025-09_r38.patch"

          echo "🧪 Wiring xxKSU source..."
          cp -r "${{ github.workspace }}/xxksu_src" KernelSU
          DRIVER_DIR="drivers"
          if [ -d "common/drivers" ]; then
            DRIVER_DIR="common/drivers"
          fi
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          echo 'ccflags-y += -I$(srctree)/drivers/kernelsu' >> "$DRIVER_DIR/kernelsu/Makefile"

          cp -r KernelSU/uapi KernelSU/kernel/uapi 2>/dev/null || true
          mkdir -p include/uapi
          cp -f KernelSU/kernel/policy/*.h include/uapi/ 2>/dev/null || true
          cp -f KernelSU/kernel/policy/*.h include/ 2>/dev/null || true
          cp -f KernelSU/kernel/include/*.h include/ 2>/dev/null || true
          cp -f KernelSU/kernel/uapi/*.h include/uapi/ 2>/dev/null || true

          echo "🧪 Applying verified shared Patch 11 to xxKSU..."
          cd KernelSU
          patch -p1 < "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch"
          cd ..

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            echo "🧪 Applying 6.12-compatible manual security hooks (manual profile)..."
            patch -p1 -l < "${{ github.workspace }}/.github/fixtures/r38/manual-security-hooks-v2.0.patch"
            patch -p1 -l < "${{ github.workspace }}/.github/fixtures/r38/scope-min-manual-hooks-v2.3.patch"
          else
            echo "ℹ️ LSM/BL profile: skipping manual security hooks."
          fi

          if [ -n "$(find . -name "*.rej")" ]; then
            echo "❌ Patch rejects found!"
            find . -name "*.rej"
            exit 1
          fi
          echo "✅ All GKI r38 patches applied cleanly with 0 rejects!"

      - name: Configure Kernel (GKI 6.12 r38)
        env:
          LLVM: 1
          LLVM_IAS: 1
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: clang
          HOSTLD: ld.lld
          CC: clang
          LD: ld.lld
          AR: llvm-ar
          NM: llvm-nm
          OBJCOPY: llvm-objcopy
          OBJDUMP: llvm-objdump
          READELF: llvm-readelf
          STRIP: llvm-strip
        run: |
          set -euo pipefail
          cd kernel_tree
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ ! -f "$DEFCONFIG" ] && [ -f "common/$DEFCONFIG" ]; then
            DEFCONFIG="common/$DEFCONFIG"
          fi

          echo "⚙️ Injecting SuSFS configurations..."
          cat >> "$DEFCONFIG" <<-'EOF'
          # SuSFS Base Configurations
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KSU_SUSFS_TRY_UMOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set
          CONFIG_KSU_FEATURE_SULOG=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          EOF

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            cat >> "$DEFCONFIG" <<-'EOF'
          # xxKSU Manual Hook Configurations
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=n
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=n
          CONFIG_KSU_KPROBES_KSUD=n
          EOF
          elif [ "${{ matrix.hook_mode }}" = "lsm_bl" ]; then
            cat >> "$DEFCONFIG" <<-'EOF'
          # xxKSU LSM + Branch Link Hook Configurations
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_KPROBES_KSUD=n
          EOF
          fi

          mkdir -p out
          make -j"$(nproc --all)" O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make -j"$(nproc --all)" O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build GKI Kernel Image
        env:
          LLVM: 1
          LLVM_IAS: 1
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: clang
          HOSTLD: ld.lld
          CC: clang
          LD: ld.lld
          AR: llvm-ar
          NM: llvm-nm
          OBJCOPY: llvm-objcopy
          OBJDUMP: llvm-objdump
          READELF: llvm-readelf
          STRIP: llvm-strip
        run: |
          set -euo pipefail
          cd kernel_tree
          echo "🔨 Compiling GKI 6.12 r38 (${{ matrix.hook_mode }})..."
          export KCFLAGS="-fdebug-prefix-map=$(pwd)=. -fmacro-prefix-map=$(pwd)=. -ffile-prefix-map=$(pwd)=. -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          make -j"$(nproc --all)" O=out Image

      - name: Verify GKI Build Artifacts & Link Evidence
        run: |
          set -euo pipefail
          echo "🔍 Verifying GKI 6.12 r38 (${{ matrix.hook_mode }}) build artifacts & link evidence..."
          IMG="kernel_tree/out/arch/arm64/boot/Image"
          VMLINUX="kernel_tree/out/vmlinux"
          SYSMAP="kernel_tree/out/System.map"
          DOTCONFIG="kernel_tree/out/.config"
          SUSFS_OBJ="kernel_tree/out/fs/susfs.o"
          [ ! -f "$SUSFS_OBJ" ] && [ -f "kernel_tree/out/common/fs/susfs.o" ] && SUSFS_OBJ="kernel_tree/out/common/fs/susfs.o"
          KSU_OBJ="kernel_tree/out/drivers/kernelsu/ksu.o"
          [ ! -f "$KSU_OBJ" ] && [ -f "kernel_tree/out/common/drivers/kernelsu/ksu.o" ] && KSU_OBJ="kernel_tree/out/common/drivers/kernelsu/ksu.o"
          AR="llvm-ar"
          NM="llvm-nm"
          READELF="llvm-readelf"

          echo "=== MANDATORY GATE 1: Valid Kernel Image ($IMG) ==="
          if [ ! -f "$IMG" ]; then
            echo "❌ ERROR: $IMG not found!"
            exit 1
          fi
          IMG_SIZE=$(stat -c%s "$IMG")
          echo "Image size: $IMG_SIZE bytes"
          if [ "$IMG_SIZE" -lt 10000000 ]; then
            echo "❌ ERROR: Image size ($IMG_SIZE bytes) is suspiciously small (<10MB)!"
            exit 1
          fi
          # Verify ARM64 kernel Image header magic at offset 0x38 (ARM\x64)
          MAGIC=$(od -A n -j 56 -N 4 -t x1 "$IMG" | tr -d ' ')
          if [ "$MAGIC" = "41524d64" ]; then
            echo "  ✅ Valid uncompressed ARM64 kernel Image verified (magic: ARM\x64)"
          else
            echo "  ⚠️ Non-standard magic ($MAGIC), checking file utility..."
            file "$IMG" | grep -E "ARM64|kernel"
          fi

          echo "=== MANDATORY GATE 2: ELF64 / AArch64 vmlinux ($VMLINUX) ==="
          if [ ! -f "$VMLINUX" ]; then
            echo "❌ ERROR: $VMLINUX not found!"
            exit 1
          fi
          VMLINUX_SIZE=$(stat -c%s "$VMLINUX")
          echo "vmlinux size: $VMLINUX_SIZE bytes"
          if [ "$VMLINUX_SIZE" -lt 20000000 ]; then
            echo "❌ ERROR: vmlinux size ($VMLINUX_SIZE bytes) is suspiciously small (<20MB)!"
            exit 1
          fi
          "$READELF" -h "$VMLINUX" | grep -E "Class:.*ELF64"
          "$READELF" -h "$VMLINUX" | grep -E "Machine:.*AArch64"
          VMLINUX_TYPE=$("$READELF" -h "$VMLINUX" | grep -E "Type:" | sed -e 's/^[[:space:]]*Type:[[:space:]]*//')
          echo "  ✅ vmlinux ELF64 / AArch64 verified (ELF Type: $VMLINUX_TYPE)"

          echo "=== MANDATORY GATE 3: SuSFS Object & Archive Compilation ==="
          if [ ! -f "$SUSFS_OBJ" ]; then
            echo "❌ ERROR: SuSFS object ($SUSFS_OBJ) was not compiled!"
            exit 1
          fi
          "$READELF" -h "$SUSFS_OBJ" | grep -q "ELF64"
          "$READELF" -h "$SUSFS_OBJ" | grep -q "AArch64"
          echo "  ✅ Compiled SuSFS object verified: $SUSFS_OBJ (ELF64 AArch64)"

          FS_ARCHIVE=""
          for candidate in "kernel_tree/out/vmlinux.a" "kernel_tree/out/fs/built-in.a" "kernel_tree/out/common/fs/built-in.a" $(find kernel_tree/out -name "*.a" 2>/dev/null); do
            if [ -f "$candidate" ] && "$AR" t "$candidate" 2>/dev/null | grep -q "susfs.o"; then
              FS_ARCHIVE="$candidate"
              break
            fi
          done
          if [ -n "$FS_ARCHIVE" ]; then
            echo "  ✅ SuSFS object confirmed archived in $FS_ARCHIVE"
          else
            echo "❌ ERROR: susfs.o is not archived in any kernel archive!"
            exit 1
          fi

          echo "=== MANDATORY GATE 4: xxKSU Object & Archive Compilation ==="
          if [ ! -f "$KSU_OBJ" ]; then
            echo "❌ ERROR: xxKSU object ($KSU_OBJ) was not compiled!"
            exit 1
          fi
          "$READELF" -h "$KSU_OBJ" | grep -q "ELF64"
          "$READELF" -h "$KSU_OBJ" | grep -q "AArch64"
          echo "  ✅ Compiled xxKSU object verified: $KSU_OBJ (ELF64 AArch64)"

          KSU_ARCHIVE=""
          for candidate in "kernel_tree/out/vmlinux.a" "kernel_tree/out/drivers/kernelsu/built-in.a" "kernel_tree/out/common/drivers/kernelsu/built-in.a" "kernel_tree/out/drivers/built-in.a" "kernel_tree/out/common/drivers/built-in.a" $(find kernel_tree/out -name "*.a" 2>/dev/null); do
            if [ -f "$candidate" ] && "$AR" t "$candidate" 2>/dev/null | grep -q "ksu.o"; then
              KSU_ARCHIVE="$candidate"
              break
            fi
          done
          if [ -n "$KSU_ARCHIVE" ]; then
            echo "  ✅ xxKSU object confirmed archived in $KSU_ARCHIVE"
          else
            echo "❌ ERROR: ksu.o is not archived in any kernel archive!"
            exit 1
          fi

          echo "=== MANDATORY GATE 5: Exact Final .config & Profile Contract ==="
          grep -q "CONFIG_KSU_SUSFS=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_PATH=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_PATH missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_KSTAT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_KSTAT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SPOOF_UNAME missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_ENABLE_LOG=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_ENABLE_LOG missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_OPEN_REDIRECT missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS_SUS_MAP=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_SUSFS_SUS_MAP missing in .config!"; exit 1; }
          grep -q "CONFIG_KSU=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU missing in .config!"; exit 1; }

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            if grep -q "CONFIG_KSU_LSM_SECURITY_HOOKS=y" "$DOTCONFIG"; then
              echo "❌ CONFIG_KSU_LSM_SECURITY_HOOKS unexpectedly enabled in manual mode!"
              exit 1
            fi
            if grep -q "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" "$DOTCONFIG"; then
              echo "❌ CONFIG_KSU_HACK_ARM64_BRANCH_LINK unexpectedly enabled in manual mode!"
              exit 1
            fi
            echo "  ✅ Verified manual profile .config contract (LSM & BL hooks unset)"
          elif [ "${{ matrix.hook_mode }}" = "lsm_bl" ]; then
            grep -q "CONFIG_KSU_LSM_SECURITY_HOOKS=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_LSM_SECURITY_HOOKS missing in .config!"; exit 1; }
            grep -q "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" "$DOTCONFIG" || { echo "❌ CONFIG_KSU_HACK_ARM64_BRANCH_LINK missing in .config!"; exit 1; }
            echo "  ✅ Verified lsm_bl profile .config contract (LSM & BL hooks enabled)"
          fi

          echo "=== SUPPORTING EVIDENCE: System.map & Link Symbols ==="
          if [ -f "$SYSMAP" ]; then
            SYSMAP_TOTAL=$(wc -l < "$SYSMAP")
            echo "  System.map total symbols: $SYSMAP_TOTAL"
            SUSFS_COUNT=$(grep -c -E "[[:space:]]susfs_" "$SYSMAP" || true)
            echo "  SuSFS symbols in System.map: $SUSFS_COUNT"
            KSU_COUNT=$(grep -c -E "[[:space:]](kernelsu|ksu)_" "$SYSMAP" || true)
            echo "  xxKSU symbols in System.map: $KSU_COUNT"

            if grep -w "kernelsu_init" "$SYSMAP" >/dev/null 2>&1; then
              echo "  ℹ️ Supporting: found device_initcall symbol in System.map: kernelsu_init"
            elif "$NM" "$VMLINUX" 2>/dev/null | grep -w "kernelsu_init" >/dev/null 2>&1; then
              echo "  ℹ️ Supporting: found device_initcall symbol in vmlinux: kernelsu_init"
            else
              echo "  ℹ️ Supporting: kernelsu_init internalized or inlined by compiler/LTO"
            fi

            if [ "${{ matrix.hook_mode }}" = "manual" ]; then
              MANUAL_FOUND=0
              for sym in ksu_inode_rename ksu_handle_execveat ksu_task_fix_setuid; do
                if grep -w "$sym" "$SYSMAP" >/dev/null 2>&1; then
                  echo "  ℹ️ Supporting: found manual hook symbol: $sym"
                  MANUAL_FOUND=1
                fi
              done
              if [ "$MANUAL_FOUND" -eq 1 ]; then
                echo "  ✅ Manual hook symbols observed in System.map"
              else
                echo "  ℹ️ Supporting: manual hook symbols inlined/optimized by compiler"
              fi
              if grep -w "ksu_do_execveat_common" "$SYSMAP" >/dev/null 2>&1; then
                echo "  ⚠️ Supporting: ksu_do_execveat_common present in System.map"
              else
                echo "  ✅ Confirmed BL hook symbol absent in manual mode"
              fi
            elif [ "${{ matrix.hook_mode }}" = "lsm_bl" ]; then
              BL_FOUND=0
              for sym in ksu_do_execveat_common ksu_do_execveat_common_fn; do
                if grep -w "$sym" "$SYSMAP" >/dev/null 2>&1; then
                  echo "  ℹ️ Supporting: found BL hook symbol: $sym"
                  BL_FOUND=1
                fi
              done
              if [ "$BL_FOUND" -eq 1 ]; then
                echo "  ✅ BL hook symbols observed in System.map"
              else
                echo "  ℹ️ Supporting: BL hook symbols inlined/optimized by compiler"
              fi
            fi
          else
            echo "  ℹ️ System.map not generated; object and image verification pass."
          fi

          echo "✅ Strict post-build validation PASSED for GKI 6.12 r38 (${{ matrix.hook_mode }})!"

      - name: Package AnyKernel3 Flashable ZIP (GKI 6.12 r38)
        run: |
          set -euo pipefail
          cp "kernel_tree/out/arch/arm64/boot/Image" anykernel3/Image
          ZIP_NAME="xxKSU_GKI_6.12_r38_${{ matrix.hook_mode }}_SUSFS-1.5.5.zip"
          ( cd anykernel3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          mkdir -p artifacts
          mv "$ZIP_NAME" artifacts/
          cp kernel_tree/out/.config "artifacts/config_gki_r38_${{ matrix.hook_mode }}"

      - name: Upload GKI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel_gki-android16-6.12-r38-${{ matrix.hook_mode }}
          path: artifacts/
