name: "4-Profile Production Patch Integration & Verification"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to Validate (all, sultan, gki_r38)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "sultan"
          - "gki_r38"
      hook_mode:
        description: "Hook Mode (all, manual, lsm_bl)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "manual"
          - "lsm_bl"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-kernels.yml"
      - "patches/**"
      - ".github/fixtures/**"

permissions:
  contents: read
  actions: write

jobs:
  build_sultan:
    name: "Sultan 6.1 (${{ matrix.hook_mode }})"
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'sultan' || github.event.inputs.target == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook_mode: [manual, lsm_bl]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Sultan Kernel, SuSFS and xxKSU
        run: |
          set -euo pipefail
          echo "📥 Cloning Sultan tensynos kernel (16.0.0-sultan / af5c65b9)..."
          git clone --depth=1 --single-branch -b "16.0.0-sultan" "https://github.com/kerneltoast/android_kernel_google_tensynos.git" sultan
          cd sultan
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "af5c65b9547a9f33c5f566430d0434aecab5a8b5" ]; then
            echo "❌ Sultan commit mismatch: expected af5c65b9547a9f33c5f566430d0434aecab5a8b5, got $ACTUAL_COMMIT"
            exit 1
          fi
          cd ..

          echo "📥 Fetching upstream SuSFS (sultan-shiba-susfs-minimal / 7fd1da8e)..."
          git init susfs_src
          cd susfs_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://gitlab.com/simonpunk/susfs4ksu.git"
          git fetch --depth=1 origin "7fd1da8e0cc8d1b572c97c5fe4a27d0ec6e3e2f1"
          git checkout FETCH_HEAD
          cd ..

          echo "📥 Fetching authoritative xxKSU (41c73d28)..."
          git init xxksu_src
          cd xxksu_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://github.com/backslashxx/KernelSU.git"
          git fetch --depth=1 origin "41c73d28d054f74eabe8a3ba494f14dc3402b3f8"
          git checkout FETCH_HEAD
          cd ..

      - name: Integrate SuSFS, xxKSU and Patches (Sultan 6.1 ${{ matrix.hook_mode }})
        run: |
          set -euo pipefail
          cd sultan

          echo "📋 Copying SuSFS core source files..."
          mkdir -p fs/ include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "🧪 Applying verified Sultan Patch 51..."
          patch -p1 --fuzz=0 < "${{ github.workspace }}/patches/sultan-android14-6.1/51_deinlined_susfs_hooks_sultan-android14-6.1.patch"

          echo "🧪 Wiring xxKSU source..."
          cp -r "${{ github.workspace }}/xxksu_src" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "🧪 Applying verified shared Patch 11 to xxKSU..."
          cd KernelSU
          patch -p1 --fuzz=0 < "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch"
          cd ..

          echo "🧪 Applying Sultan base patches..."
          patch -p1 --fuzz=0 < "${{ github.workspace }}/.github/fixtures/sultan/60_scripts_mkcompile_h.patch"
          patch -p1 --fuzz=0 < "${{ github.workspace }}/.github/fixtures/sultan/61_scripts_setlocalversion.patch"
          patch -p1 --fuzz=0 < "${{ github.workspace }}/.github/fixtures/sultan/62_init_Makefile.patch"
          patch -p1 --fuzz=0 < "${{ github.workspace }}/.github/fixtures/sultan/0001-modify-noinline.patch"

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            echo "🧪 Applying manual security hooks (manual profile)..."
            patch -p1 -l --fuzz=0 < "${{ github.workspace }}/.github/fixtures/manual-security-hooks-v2.0.patch"
            patch -p1 -l --fuzz=0 < "${{ github.workspace }}/.github/fixtures/scope-min-manual-hooks-v2.3.patch"
          else
            echo "ℹ️ LSM/BL profile: skipping manual security hooks."
          fi

          echo "🔍 Checking for patch rejects..."
          if [ -n "$(find . -name "*.rej")" ]; then
            echo "❌ Patch rejects found!"
            find . -name "*.rej"
            exit 1
          fi
          echo "✅ All Sultan 6.1 (${{ matrix.hook_mode }}) patches applied cleanly with exit code 0, 0 rejects, 0 fuzz!"

      - name: Generate Sultan Integration Summary
        run: |
          set -euo pipefail
          cd sultan
          echo "### 📄 Sultan 6.1 (${{ matrix.hook_mode }}) Patch Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`sultan-android14-6.1\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile Mode:** \`${{ matrix.hook_mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Commit:** \`af5c65b9547a9f33c5f566430d0434aecab5a8b5\` (16.0.0-sultan)" >> $GITHUB_STEP_SUMMARY
          echo "- **SuSFS Commit:** \`7fd1da8e0cc8d1b572c97c5fe4a27d0ec6e3e2f1\`" >> $GITHUB_STEP_SUMMARY
          echo "- **xxKSU Commit:** \`41c73d28d054f74eabe8a3ba494f14dc3402b3f8\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejects:** 0" >> $GITHUB_STEP_SUMMARY
          echo "- **Fuzz:** 0" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ PASS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Modified Files Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git status --short >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build_gki_r38:
    name: "GKI 6.12 r38 (${{ matrix.hook_mode }})"
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'gki_r38' || github.event.inputs.target == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook_mode: [manual, lsm_bl]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GKI r38 Source, SuSFS and xxKSU
        run: |
          set -euo pipefail
          mkdir -p kernel_tree
          echo "📥 Downloading android16-6.12-2025-09_r38 kernel source archive..."
          curl -LSs "https://github.com/yapixel/gki-build-assets/releases/download/android16-6.12-2025-09_r38/common-android16-6.12-2025-09_r38.tar.gz" | tar -xz -C kernel_tree
          sed -i 's/ -dirty//g' kernel_tree/scripts/setlocalversion 2>/dev/null || true

          echo "📥 Fetching upstream SuSFS (gki-android16-6.12 / c8f64e41)..."
          git init susfs_src
          cd susfs_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://gitlab.com/simonpunk/susfs4ksu.git"
          git fetch --depth=1 origin "c8f64e41e3dea2cd44754d7472d3cd0bc0b40784"
          git checkout FETCH_HEAD
          cd ..

          echo "📥 Fetching authoritative xxKSU (41c73d28)..."
          git init xxksu_src
          cd xxksu_src
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://github.com/backslashxx/KernelSU.git"
          git fetch --depth=1 origin "41c73d28d054f74eabe8a3ba494f14dc3402b3f8"
          git checkout FETCH_HEAD
          cd ..

      - name: Integrate SuSFS, xxKSU and Patches (GKI 6.12 r38 ${{ matrix.hook_mode }})
        run: |
          set -euo pipefail
          cd kernel_tree

          echo "📋 Copying SuSFS core source files..."
          mkdir -p fs/ include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/
          cp -f "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "🧪 Applying verified GKI r38 Patch 51..."
          patch -p1 --fuzz=0 < "${{ github.workspace }}/patches/gki-android16-6.12/51_deinlined_susfs_hooks_android16-6.12-2025-09_r38.patch"

          echo "🧪 Wiring xxKSU source..."
          cp -r "${{ github.workspace }}/xxksu_src" KernelSU
          DRIVER_DIR="drivers"
          if [ -d "common/drivers" ]; then
            DRIVER_DIR="common/drivers"
          fi
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"

          echo "🧪 Applying verified shared Patch 11 to xxKSU..."
          cd KernelSU
          patch -p1 --fuzz=0 < "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch"
          cd ..

          if [ "${{ matrix.hook_mode }}" = "manual" ]; then
            echo "🧪 Applying 6.12-compatible manual security hooks (manual profile)..."
            patch -p1 -l --fuzz=0 < "${{ github.workspace }}/.github/fixtures/r38/manual-security-hooks-v2.0.patch"
            patch -p1 -l --fuzz=0 < "${{ github.workspace }}/.github/fixtures/r38/scope-min-manual-hooks-v2.3.patch"
          else
            echo "ℹ️ LSM/BL profile: skipping manual security hooks."
          fi

          echo "🔍 Checking for patch rejects..."
          if [ -n "$(find . -name "*.rej")" ]; then
            echo "❌ Patch rejects found!"
            find . -name "*.rej"
            exit 1
          fi
          echo "✅ All GKI 6.12 r38 (${{ matrix.hook_mode }}) patches applied cleanly with exit code 0, 0 rejects, 0 fuzz!"

      - name: Generate GKI r38 Integration Summary
        run: |
          set -euo pipefail
          cd kernel_tree
          echo "### 📄 GKI 6.12 r38 (${{ matrix.hook_mode }}) Patch Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`gki-android16-6.12\` (android16-6.12-2025-09_r38)" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile Mode:** \`${{ matrix.hook_mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SuSFS Commit:** \`c8f64e41e3dea2cd44754d7472d3cd0bc0b40784\`" >> $GITHUB_STEP_SUMMARY
          echo "- **xxKSU Commit:** \`41c73d28d054f74eabe8a3ba494f14dc3402b3f8\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejects:** 0" >> $GITHUB_STEP_SUMMARY
          echo "- **Fuzz:** 0" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ PASS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Patch Verification Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find fs/ -name "*.rej" -o -name "*.orig" 2>/dev/null || true
          echo "Clean patch application verified (0 rejects, 0 fuzz)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
