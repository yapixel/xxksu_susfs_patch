name: "11 Patch: Authoritative Pipeline for KernelSU (xxKSU)"

on:
  workflow_dispatch:
    inputs:
      ksu_commit:
        description: "Authoritative KernelSU Commit to Test"
        required: false
        default: "bb0be9297da42ff3f63819125314ce0b13935a06"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-11-ksu-patch.yml"
      - ".github/scripts/v2/pipeline.py"
      - "patches/xxksu/11_enable_susfs_for_ksu.patch"
      - "patches/manifest.json"

concurrency:
  group: "production-promotion"
  cancel-in-progress: false

permissions:
  contents: read

env:
  KSU_REPO: "backslashxx/KernelSU"
  KSU_COMMIT: "bb0be9297da42ff3f63819125314ce0b13935a06"

jobs:
  pipeline_11_patch:
    name: "Pipeline 11 Patch (Generate -> Validate -> Promote -> Deliver)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Initial Patches Manifest Consistency
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.manifests.patch_manifest --check

      - name: Fetch Clean Authoritative KernelSU Source
        run: |
          set -euo pipefail
          TARGET_COMMIT="${{ github.event.inputs.ksu_commit || env.KSU_COMMIT }}"
          echo "📥 Fetching authoritative KernelSU source from ${{ env.KSU_REPO }} @ $TARGET_COMMIT..."
          git init clean_ksu
          cd clean_ksu
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://github.com/${{ env.KSU_REPO }}.git"
          git fetch --depth=1 origin "$TARGET_COMMIT"
          git checkout FETCH_HEAD

      - name: Run Patch 11 Authoritative Pipeline (Generate -> Candidate -> Validate -> Promote -> Deliver)
        run: |
          set -euo pipefail
          echo "🚀 Running Authoritative Pipeline for xxksu-patch11..."
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.pipeline \
            --patch-id xxksu-patch11 \
            --upstream-input clean_ksu \
            --target-tree clean_ksu \
            --candidate-dir candidate_patches \
            --promote \
            --write-back

      - name: Verify Single-Pass Mutation (Clean 8 Files Modified)
        run: |
          set -euo pipefail
          cd clean_ksu
          find . -type f \( -name "*.orig" -o -name "*~" \) -delete
          MOD_COUNT="$(git diff --name-only | wc -l)"
          echo "Total modified files: $MOD_COUNT"
          if [ "$MOD_COUNT" -ne 8 ]; then
            echo "❌ Expected exactly 8 modified files, found $MOD_COUNT"
            git diff --name-only
            exit 1
          fi
          echo "✅ Patch 11 applied cleanly on clean KernelSU with 0 rejects across 8 files!"

      - name: Generate 11 Patch Statistics Report
        run: |
          echo "## 📊 Universal 11 Patch (xxKSU) Verification Report" > report_11.md
          echo "Generated on: $(date -u)" >> report_11.md
          echo "" >> report_11.md
          echo "### 📄 Git Diffstat (8 Files Target)" >> report_11.md
          echo '```' >> report_11.md
          git apply --stat patches/xxksu/11_enable_susfs_for_ksu.patch >> report_11.md
          echo '```' >> report_11.md
          cat report_11.md >> $GITHUB_STEP_SUMMARY

      - name: Report Independent Midori Reference Cross-Check
        if: always()
        run: |
          if [ -f "candidate_patches/xxksu-patch11/reference_cross_check.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Independent Midori Reference Cross-Check Parity Report" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat candidate_patches/xxksu-patch11/reference_cross_check.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
