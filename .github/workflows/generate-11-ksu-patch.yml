name: "11 Patch: Validate Verified Patch for KernelSU (xxKSU)"

on:
  workflow_dispatch:
    inputs:
      ksu_commit:
        description: "Authoritative KernelSU Commit to Test"
        required: false
        default: "bb0be9297da42ff3f63819125314ce0b13935a06"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-11-ksu-patch.yml"
      - "patches/xxksu/11_enable_susfs_for_ksu.patch"
      - "patches/manifest.json"

permissions:
  contents: read
  actions: write

env:
  KSU_REPO: "backslashxx/KernelSU"
  KSU_COMMIT: "bb0be9297da42ff3f63819125314ce0b13935a06"
  PATCH_11_SHA256: "c0cfe7f3931061d2732d5cc097e44babaf6b51d6a1f19b9fb466c23c54affd4e"

jobs:
  validate_11_patch:
    name: "Validate Authoritative 11 Patch"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Patches Manifest Consistency
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.manifests.patch_manifest --check

      - name: Verify Patch 11 Integrity and Checksum
        run: |
          set -euo pipefail
          PATCH_FILE="patches/xxksu/11_enable_susfs_for_ksu.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "❌ Error: $PATCH_FILE not found"
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)"
          echo "Expected SHA-256: ${{ env.PATCH_11_SHA256 }}"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "${{ env.PATCH_11_SHA256 }}" ]; then
            echo "❌ Patch 11 SHA-256 mismatch!"
            exit 1
          fi
          echo "✅ Patch 11 integrity and checksum verified!"

      - name: Validate 11 Patch on Authoritative backslashxx/KernelSU
        run: |
          set -euo pipefail
          TARGET_COMMIT="${{ github.event.inputs.ksu_commit || env.KSU_COMMIT }}"
          echo "🧪 Testing authoritative 11 patch on ${{ env.KSU_REPO }} @ $TARGET_COMMIT..."
          git init test_ksu
          cd test_ksu
          git config user.name "yapixel"
          git config user.email "yapixel@users.noreply.github.com"
          git remote add origin "https://github.com/${{ env.KSU_REPO }}.git"
          git fetch --depth=1 origin "$TARGET_COMMIT"
          git checkout FETCH_HEAD

          patch -p1 < "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch"

          if [ -n "$(find . -name "*.rej")" ]; then
            echo "❌ Rejects found after applying 11 patch!"
            find . -name "*.rej"
            exit 1
          fi
          find . -type f \( -name "*.orig" -o -name "*~" \) -delete

          MOD_COUNT="$(git diff --name-only | wc -l)"
          echo "Total modified files: $MOD_COUNT"
          if [ "$MOD_COUNT" -ne 10 ]; then
            echo "❌ Expected exactly 10 modified files, found $MOD_COUNT"
            git diff --name-only
            exit 1
          fi
          echo "✅ 11 Patch applied cleanly on authoritative xxKSU with 0 rejects across 10 files!"

      - name: Generate 11 Patch Statistics Report
        run: |
          echo "## 📊 Universal 11 Patch (xxKSU) Verification Report" > report_11.md
          echo "Generated on: $(date -u)" >> report_11.md
          echo "" >> report_11.md
          echo "### 📄 Git Diffstat (10 Files Target)" >> report_11.md
          echo '```' >> report_11.md
          git apply --stat patches/xxksu/11_enable_susfs_for_ksu.patch >> report_11.md
          echo '```' >> report_11.md
          cat report_11.md >> $GITHUB_STEP_SUMMARY

      - name: Upload 11 Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 11_enable_susfs_for_ksu.patch
          path: patches/xxksu/11_enable_susfs_for_ksu.patch
