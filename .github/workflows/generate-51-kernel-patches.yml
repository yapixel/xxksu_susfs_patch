name: "51 Patch: Multi-Kernel Dynamic Generation & Verification"

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "KernelSU Branch or Commit"
        required: false
        default: "bb0be9297da42ff3f63819125314ce0b13935a06"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-51-kernel-patches.yml"
      - ".github/scripts/v2/pipeline.py"
      - ".github/fixtures/**"
      - "patches/**/51_*.patch"
      - "patches/manifest.json"

concurrency:
  group: "production-promotion"
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUSFS_REPO_URL: "https://gitlab.com/simonpunk/susfs4ksu.git"
  KSU_REPO: "backslashxx/KernelSU"
  KSU_COMMIT: "bb0be9297da42ff3f63819125314ce0b13935a06"

jobs:
  matrix_51_patch:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Sultan 6.1 (Android 14)"
            target: "sultan-android14-6.1"
            susfs_branch: "sultan-shiba-susfs-minimal"
            susfs_commit: "a8324101bca5e5a2dd7d0dc82b1650e10923eec9"
            kernel_type: "git"
            kernel_repo: "https://github.com/kerneltoast/android_kernel_google_tensynos.git"
            kernel_branch: "16.0.0-sultan"
            kernel_commit: "af5c65b9547a9f33c5f566430d0434aecab5a8b5"
            out_dir: "patches/sultan-android14-6.1"
            out_patch: "51_deinlined_susfs_hooks_sultan-android14-6.1.patch"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Initial Patches Manifest Consistency
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.manifests.patch_manifest --check

      - name: Clone Upstream SuSFS Source
        run: |
          echo "📥 Fetching upstream SuSFS (commit: ${{ matrix.susfs_commit }})..."
          git init susfs_src
          cd susfs_src
          git remote add origin "${{ env.SUSFS_REPO_URL }}"
          git fetch --depth=1 origin "${{ matrix.susfs_commit }}"
          git checkout FETCH_HEAD

      - name: Prepare Clean Kernel Source Tree (${{ matrix.name }})
        run: |
          set -euo pipefail
          mkdir -p kernel_tree
          
          if [ "${{ matrix.kernel_type }}" = "git" ]; then
            echo "📥 Cloning kernel tree from ${{ matrix.kernel_repo }} (${{ matrix.kernel_branch }})..."
            git clone --depth=1 --single-branch -b "${{ matrix.kernel_branch }}" "${{ matrix.kernel_repo }}" kernel_tree
            cd kernel_tree
            git checkout "${{ matrix.kernel_commit }}" || true
            cd ..
          else
            echo "📥 Downloading kernel source from ${{ matrix.kernel_url }}..."
            curl -LSs "${{ matrix.kernel_url }}" | tar -xz -C kernel_tree
          fi

          cd kernel_tree
          if [ ! -d ".git" ]; then
            git init
            git config user.name "yapixel"
            git config user.email "yapixel@users.noreply.github.com"
            git config commit.gpgsign false
            git add -A
            git commit --no-gpg-sign -m "base: initial clean kernel tree" || true
          fi

      - name: Setup SuSFS Core Source Files (${{ matrix.name }})
        run: |
          set -euo pipefail
          cd kernel_tree
          mkdir -p fs/ include/linux/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/ || true
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/ || true
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/ || true

      - name: Run Patch 51 Authoritative Pipeline (${{ matrix.name }})
        run: |
          set -euo pipefail
          echo "🚀 Running Authoritative Pipeline for ${{ matrix.target }}-patch51..."
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.pipeline \
            --patch-id "${{ matrix.target }}-patch51" \
            --upstream-input susfs_src \
            --target-tree kernel_tree \
            --candidate-dir candidate_patches \
            --promote \
            --write-back

          cd kernel_tree
          find . -type f \( -name "*.orig" -o -name "*~" \) -delete
          git add -A
          git commit --no-gpg-sign -m "SUSFS de-inlined hooks for ${{ matrix.target }}" || true
          
          echo "✨ Authoritative 51 patch applied and verified cleanly:"
          head -n 25 "${{ github.workspace }}/${{ matrix.out_dir }}/${{ matrix.out_patch }}"

      - name: Validate xxKSU + SuSFS Integration on Kernel Tree (${{ matrix.name }})
        run: |
          set -euo pipefail
          cd kernel_tree
          
          echo "🧪 Setting up authoritative xxKSU (${{ github.event.inputs.ksu_branch || env.KSU_COMMIT }})..."
          if [ ! -d "KernelSU" ]; then
            git init KernelSU
            cd KernelSU
            git config user.name "yapixel"
            git config user.email "yapixel@users.noreply.github.com"
            git remote add origin "https://github.com/${{ env.KSU_REPO }}.git"
            git fetch --depth=1 origin "${{ github.event.inputs.ksu_branch || env.KSU_COMMIT }}"
            git checkout FETCH_HEAD
            cd ..
          fi

          DRIVER_DIR="drivers"
          if [ -d "common/drivers" ]; then
            DRIVER_DIR="common/drivers"
          fi

          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"
          
          # Apply universal 11 patch to xxKSU via exact_patch (single-pass: 0 fuzz, 0 offsets, 0 rejects)
          echo "🧪 Applying universal 11 patch to KernelSU..."
          cd KernelSU
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.validation.exact_patch \
            --patch "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch" \
            --target-tree .
          find . -type f \( -name "*.orig" -o -name "*~" \) -delete
          cd ..

          # For Sultan specific base patches if required
          if [ "${{ matrix.target }}" = "sultan-android14-6.1" ]; then
            patch -p1 -l < "${{ github.workspace }}/.github/fixtures/manual-security-hooks-v2.0.patch" || true
            patch -p1 -l < "${{ github.workspace }}/.github/fixtures/scope-min-manual-hooks-v2.3.patch" || true
          fi

          echo "✅ Full kernel tree integration verified successfully!"

      - name: Generate Statistics Report
        run: |
          echo "### 📄 ${{ matrix.name }} 51 Patch Diffstat" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git apply --stat "${{ matrix.out_dir }}/${{ matrix.out_patch }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  validate_gki_r38_compat:
    name: "GKI 6.12 (Android 16 r38 Compatibility)"
    needs: [matrix_51_patch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Initial Patches Manifest Consistency
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.manifests.patch_manifest --check

      - name: Clone Upstream SuSFS Source
        run: |
          echo "📥 Fetching upstream SuSFS (commit: b213c54126fb243595ce7876e91d84d6e0861fec)..."
          git init susfs_src
          cd susfs_src
          git remote add origin "${{ env.SUSFS_REPO_URL }}"
          git fetch --depth=1 origin "b213c54126fb243595ce7876e91d84d6e0861fec"
          git checkout FETCH_HEAD

      - name: Prepare Clean Kernel Source Tree (android16-6.12-2025-09_r38)
        run: |
          set -euo pipefail
          mkdir -p kernel_tree
          echo "📥 Downloading r38 kernel source archive..."
          curl -LSs "https://github.com/yapixel/gki-build-assets/releases/download/android16-6.12-2025-09_r38/common-android16-6.12-2025-09_r38.tar.gz" | tar -xz -C kernel_tree

          cd kernel_tree
          if [ ! -d ".git" ]; then
            git init
            git config user.name "yapixel"
            git config user.email "yapixel@users.noreply.github.com"
            git config commit.gpgsign false
            git add -A
            git commit --no-gpg-sign -m "base: initial clean kernel tree r38" || true
          fi

      - name: Setup SuSFS Core Source Files (r38)
        run: |
          set -euo pipefail
          cd kernel_tree
          mkdir -p fs/ include/linux/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/ || true
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/ || true
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/ || true

      - name: Run Patch 51 Authoritative Pipeline (r38 Compatibility)
        run: |
          set -euo pipefail
          echo "🚀 Running Authoritative Pipeline for gki-android16-6.12-r38-patch51..."
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.pipeline \
            --patch-id gki-android16-6.12-r38-patch51 \
            --upstream-input susfs_src \
            --target-tree kernel_tree \
            --candidate-dir candidate_patches \
            --promote \
            --write-back

          cd kernel_tree
          find . -type f \( -name "*.orig" -o -name "*~" \) -delete
          git add -A
          git commit --no-gpg-sign -m "SUSFS de-inlined hooks for android16-6.12-2025-09_r38" || true
          echo "✅ r38 Compatibility Patch 51 applied cleanly with 0 rejects, 0 fuzz, and 0 offsets!"

      - name: Validate xxKSU + SuSFS Integration on r38 Kernel Tree
        run: |
          set -euo pipefail
          cd kernel_tree

          echo "🧪 Setting up authoritative xxKSU (${{ github.event.inputs.ksu_branch || env.KSU_COMMIT }})..."
          if [ ! -d "KernelSU" ]; then
            git init KernelSU
            cd KernelSU
            git config user.name "yapixel"
            git config user.email "yapixel@users.noreply.github.com"
            git remote add origin "https://github.com/${{ env.KSU_REPO }}.git"
            git fetch --depth=1 origin "${{ github.event.inputs.ksu_branch || env.KSU_COMMIT }}"
            git checkout FETCH_HEAD
            cd ..
          fi

          DRIVER_DIR="drivers"
          if [ -d "common/drivers" ]; then
            DRIVER_DIR="common/drivers"
          fi

          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"

          # Apply universal 11 patch to xxKSU via exact_patch (single-pass: 0 fuzz, 0 offsets, 0 rejects)
          echo "🧪 Applying universal 11 patch to KernelSU..."
          cd KernelSU
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.validation.exact_patch \
            --patch "${{ github.workspace }}/patches/xxksu/11_enable_susfs_for_ksu.patch" \
            --target-tree .
          find . -type f \( -name "*.orig" -o -name "*~" \) -delete
          cd ..

          echo "✅ Full r38 kernel tree integration (Patch 51 + xxKSU Patch 11) verified successfully!"

      - name: Generate Statistics Report (r38 Compatibility)
        run: |
          echo "### 📄 GKI 6.12 r38 Compatibility Patch 51 Diffstat" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git apply --stat "${{ github.workspace }}/patches/gki-android16-6.12/51_deinlined_susfs_hooks_android16-6.12-2025-09_r38.patch" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
