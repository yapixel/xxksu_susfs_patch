name: "51 Patch: Multi-Kernel Dynamic Generation & Verification"

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "Exact reviewed KernelSU candidate SHA (empty: accepted revision)"
        required: false
        default: ""
      test_fail_validation:
        description: "Simulate validation failure for atomicity test (sultan | gki | none)"
        required: false
        default: "none"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-51-kernel-patches.yml"
      - ".github/scripts/v2/pipeline.py"
      - ".github/scripts/v2/policy/**"
      - ".github/scripts/v2/validation/patch51_kbuild.py"
      - ".github/scripts/v2/validation/reference_cross_check.py"
      - ".github/fixtures/**"
      - "patches/**/51_*.patch"
      - "patches/manifest.json"

concurrency:
  group: "production-promotion"
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUSFS_REPO_URL: "https://gitlab.com/simonpunk/susfs4ksu.git"
  KSU_REPO: "backslashxx/KernelSU"

jobs:
  validate_sultan:
    name: "Validate Sultan 6.1 (Android 14)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install target Kbuild toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-14 llvm-14 lld-14 flex bison bc libelf-dev libdw-dev libssl-dev zlib1g-dev

      - name: Freeze accepted upstream identities
        env:
          KSU_OVERRIDE: ${{ github.event.inputs.ksu_branch || '' }}
        run: |
          set -euo pipefail
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          PYTHONPATH=.github/scripts python3 - <<'PY' >> "$GITHUB_ENV"
          import os, re, json
          from v2.manifests.defaults import accepted_sources
          sources = accepted_sources()
          ksu = os.environ.get("KSU_OVERRIDE") or sources["backslashxx_kernelsu"]["commit"]
          if not re.fullmatch(r"[0-9a-f]{40}", ksu):
              raise ValueError("KernelSU override must be an exact reviewed candidate SHA, not a moving ref")
          print("KSU_COMMIT=" + ksu)
          print("SULTAN_SUSFS_COMMIT=" + sources["susfs_sultan"]["commit"])
          print("GKI_SUSFS_COMMIT=" + sources["susfs_gki"]["commit"])
          target = json.load(open("patches/sultan-android14-6.1/BASELINE.json"))["upstream"]
          print("SULTAN_KERNEL_COMMIT=" + target["resolved_commit"])
          print("SULTAN_KERNEL_REPO=" + target["repository"])
          PY

      - name: Verify Initial Patches Manifest Consistency
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.manifests.patch_manifest --check

      - name: Clone Upstream SuSFS Source
        run: |
          set -euo pipefail
          echo "📥 Fetching upstream SuSFS (commit: $SULTAN_SUSFS_COMMIT)..."
          git init susfs_src
          cd susfs_src
          git remote add origin "${{ env.SUSFS_REPO_URL }}"
          git fetch --depth=1 origin "$SULTAN_SUSFS_COMMIT"
          git checkout FETCH_HEAD

      - name: Prepare Clean Kernel Source Tree (Sultan 6.1)
        run: |
          set -euo pipefail
          mkdir -p kernel_tree
          echo "📥 Cloning kernel tree from https://github.com/kerneltoast/android_kernel_google_tensynos.git (16.0.0-sultan)..."
          cd kernel_tree
          git init
          git remote add origin "$SULTAN_KERNEL_REPO"
          git fetch --depth=1 origin "$SULTAN_KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Setup SuSFS Core Source Files (Sultan 6.1)
        run: |
          set -euo pipefail
          cd kernel_tree
          mkdir -p fs/ include/linux/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/

      - name: Run Patch 51 Candidate Validation (Sultan 6.1)
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.test_fail_validation || 'none' }}" = "sultan" ]; then
            echo "❌ Simulating validation failure for Sultan (Atomicity Test)"
            exit 1
          fi
          echo "🚀 Running Candidate Generation & Validation for sultan-android14-6.1-patch51..."
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.pipeline \
            --patch-id sultan-android14-6.1-patch51 \
            --upstream-input susfs_src \
            --target-tree kernel_tree \
            --candidate-dir candidate_patches


      - name: Real Kbuild objects and SuSFS symbol closure (sultan)
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.validation.patch51_kbuild \
            --tree kernel_tree \
            --candidate candidate_patches/sultan-android14-6.1-patch51/51_deinlined_susfs_hooks_sultan-android14-6.1.patch \
            --workspace "$RUNNER_TEMP/kbuild-sultan"
          cp "$RUNNER_TEMP/kbuild-sultan/gates.json" candidate_patches/sultan-android14-6.1-patch51/gates.json
          PYTHONPATH=.github/scripts:.github/scripts/v2/tests python3 -m unittest test_lifecycle test_remote_mem
          echo "### sultan production validation" >> "$GITHUB_STEP_SUMMARY"
          for gate in SOURCE_AUTHENTICATED RECONSTRUCTION_PASS GIT_DIFF_GENERATION_PASS DETERMINISM_PASS POSTIMAGE_ROUNDTRIP_PASS EXACT_APPLY_PASS PATCH51_OBJECT_COMPILE_PASS PATCH51_SYMBOL_CLOSURE_PASS SEMANTIC_LIFECYCLE_PASS; do
            echo "- $gate" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Full vmlinux link: NOT_RUN (separate acceptance boundary)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Validated Sultan Candidate (Intra-Workflow Transport)
        uses: actions/upload-artifact@v4
        with:
          name: candidate-sultan-51
          path: candidate_patches/sultan-android14-6.1-patch51/
          retention-days: 1

  validate_gki_r38:
    name: "Validate GKI 6.12 (Android 16 r38 Compatibility)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install target Kbuild toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-14 llvm-14 lld-14 flex bison bc libelf-dev libdw-dev libssl-dev zlib1g-dev

      - name: Freeze accepted upstream identities
        env:
          KSU_OVERRIDE: ${{ github.event.inputs.ksu_branch || '' }}
        run: |
          set -euo pipefail
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          PYTHONPATH=.github/scripts python3 - <<'PY' >> "$GITHUB_ENV"
          import os, re, json
          from v2.manifests.defaults import accepted_sources
          sources = accepted_sources()
          ksu = os.environ.get("KSU_OVERRIDE") or sources["backslashxx_kernelsu"]["commit"]
          if not re.fullmatch(r"[0-9a-f]{40}", ksu):
              raise ValueError("KernelSU override must be an exact reviewed candidate SHA, not a moving ref")
          print("KSU_COMMIT=" + ksu)
          print("SULTAN_SUSFS_COMMIT=" + sources["susfs_sultan"]["commit"])
          print("GKI_SUSFS_COMMIT=" + sources["susfs_gki"]["commit"])
          target = json.load(open("patches/sultan-android14-6.1/BASELINE.json"))["upstream"]
          print("SULTAN_KERNEL_COMMIT=" + target["resolved_commit"])
          print("SULTAN_KERNEL_REPO=" + target["repository"])
          PY

      - name: Verify Initial Patches Manifest Consistency
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.manifests.patch_manifest --check

      - name: Clone Upstream SuSFS Source
        run: |
          set -euo pipefail
          echo "📥 Fetching upstream SuSFS (commit: $GKI_SUSFS_COMMIT)..."
          git init susfs_src
          cd susfs_src
          git remote add origin "${{ env.SUSFS_REPO_URL }}"
          git fetch --depth=1 origin "$GKI_SUSFS_COMMIT"
          git checkout FETCH_HEAD

      - name: Prepare Clean Kernel Source Tree (android16-6.12-2025-09_r38)
        run: |
          set -euo pipefail
          mkdir -p kernel_tree
          echo "📥 Downloading r38 kernel source archive..."
          archive_url=$(python3 -c 'import json; print(json.load(open(".github/fixtures/v2/r38-sources.json"))["archive_url"])')
          archive_sha=$(python3 -c 'import json; print(json.load(open(".github/fixtures/v2/r38-sources.json"))["archive_sha256"])')
          curl --fail --location --silent --show-error "$archive_url" -o r38-source.tar.gz
          printf '%s  %s\n' "$archive_sha" r38-source.tar.gz | sha256sum --check --strict
          tar -xzf r38-source.tar.gz -C kernel_tree


      - name: Setup SuSFS Core Source Files (r38)
        run: |
          set -euo pipefail
          cd kernel_tree
          mkdir -p fs/ include/linux/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/fs/susfs.c" fs/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs.h" include/linux/
          cp -r "${{ github.workspace }}/susfs_src/kernel_patches/include/linux/susfs_def.h" include/linux/

      - name: Run Patch 51 Candidate Validation (r38 Compatibility)
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.test_fail_validation || 'none' }}" = "gki" ]; then
            echo "❌ Simulating validation failure for GKI r38 (Atomicity Test)"
            exit 1
          fi
          echo "🚀 Running Candidate Generation & Validation for gki-android16-6.12-r38-patch51..."
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.pipeline \
            --patch-id gki-android16-6.12-r38-patch51 \
            --upstream-input susfs_src \
            --target-tree kernel_tree \
            --candidate-dir candidate_patches


      - name: Real Kbuild objects and SuSFS symbol closure (gki)
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 -m v2.validation.patch51_kbuild \
            --tree kernel_tree \
            --candidate candidate_patches/gki-android16-6.12-r38-patch51/51_deinlined_susfs_hooks_android16-6.12-2025-09_r38.patch \
            --workspace "$RUNNER_TEMP/kbuild-gki"
          cp "$RUNNER_TEMP/kbuild-gki/gates.json" candidate_patches/gki-android16-6.12-r38-patch51/gates.json
          PYTHONPATH=.github/scripts:.github/scripts/v2/tests python3 -m unittest test_lifecycle test_remote_mem
          echo "### gki production validation" >> "$GITHUB_STEP_SUMMARY"
          for gate in SOURCE_AUTHENTICATED RECONSTRUCTION_PASS GIT_DIFF_GENERATION_PASS DETERMINISM_PASS POSTIMAGE_ROUNDTRIP_PASS EXACT_APPLY_PASS PATCH51_OBJECT_COMPILE_PASS PATCH51_SYMBOL_CLOSURE_PASS SEMANTIC_LIFECYCLE_PASS; do
            echo "- $gate" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Full vmlinux link: NOT_RUN (separate acceptance boundary)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report Independent Midori Reference Cross-Check
        if: always()
        run: |
          if [ -f "candidate_patches/gki-android16-6.12-r38-patch51/reference_cross_check.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Independent Midori Reference Cross-Check Parity Report (GKI r38)" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat candidate_patches/gki-android16-6.12-r38-patch51/reference_cross_check.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Validated GKI r38 Candidate (Intra-Workflow Transport)
        uses: actions/upload-artifact@v4
        with:
          name: candidate-gki-r38-51
          path: candidate_patches/gki-android16-6.12-r38-patch51/
          retention-days: 1

  promote_and_deliver:
    name: "Promote & Deliver Verified Patch 51"
    needs: [validate_sultan, validate_gki_r38]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Sultan Candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-sultan-51
          path: candidate_patches/sultan-android14-6.1-patch51

      - name: Download GKI r38 Candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-gki-r38-51
          path: candidate_patches/gki-android16-6.12-r38-patch51

      - name: Atomic Promotion & Delivery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for directory in Path("candidate_patches").iterdir():
              patch = next(directory.glob("51_*.patch"))
              gates = json.loads((directory / "gates.json").read_text())
              assert gates["candidate_sha256"] == hashlib.sha256(patch.read_bytes()).hexdigest()
              assert gates["PATCH51_OBJECT_COMPILE_PASS"] and gates["PATCH51_SYMBOL_CLOSURE_PASS"]
              images = json.loads((directory / "postimages.json").read_text())
              assert images and all(x["applied"] == x["postimage"] for x in images.values())
          PY
          echo "Executing Single Atomic Promotion & Delivery for Patch 51..."
          PYTHONPATH="${{ github.workspace }}/.github/scripts" python3 -m v2.pipeline \
            --deliver-candidates \
            --candidate-target sultan-android14-6.1-patch51:candidate_patches/sultan-android14-6.1-patch51/51_deinlined_susfs_hooks_sultan-android14-6.1.patch \
            --candidate-target gki-android16-6.12-r38-patch51:candidate_patches/gki-android16-6.12-r38-patch51/51_deinlined_susfs_hooks_android16-6.12-2025-09_r38.patch \
            --write-back

      - name: Generate Statistics Report
        run: |
          echo "### 📄 Sultan 6.1 51 Patch Diffstat" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git apply --stat patches/sultan-android14-6.1/51_deinlined_susfs_hooks_sultan-android14-6.1.patch >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 📄 GKI 6.12 r38 Compatibility 51 Patch Diffstat" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git apply --stat patches/gki-android16-6.12/51_deinlined_susfs_hooks_android16-6.12-2025-09_r38.patch >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f "candidate_patches/gki-android16-6.12-r38-patch51/reference_cross_check.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Midori Reference Parity (Consumed by Single Writer)" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat candidate_patches/gki-android16-6.12-r38-patch51/reference_cross_check.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
